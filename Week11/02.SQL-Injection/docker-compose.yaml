version: '3.8'

services:
  postgres:
    image: postgres:18.4
    container_name: postgres-db-Week11-02-SQL-Injection
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: itec617
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - db-network

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin-web-Week11-02-SQL-Injection
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - db-network

  webapp:
    build: ./app
    container_name: webapp-Week11-02-SQL-Injection
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=itec617
      - DB_PORT=5432
    networks:
      - db-network

volumes:
  postgres_data:

networks:
  db-network:
    driver: bridge
