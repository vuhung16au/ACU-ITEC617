version: '3.8'

services:
  mysql:
    image: mysql:9.7.2
    container_name: mysql-db-W02-09-Docker-MySQL
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: itec617
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      db-network:
        aliases:
          - mysql-db-W02-09-Docker-MySQL

  adminer:
    image: adminer:latest
    container_name: adminer-web-W02-09-Docker-MySQL
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "5050:8080"
    depends_on:
      - mysql
    networks:
      - db-network

volumes:
  mysql_data:

networks:
  db-network:
    driver: bridge
