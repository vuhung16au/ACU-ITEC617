services:
  mariadb:
    image: mariadb:12.3.2
    container_name: mariadb-db-W02-09-Docker-MySQL
    environment:
      # MariaDB supports MARIADB_* env vars instead of MYSQL_*
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: itec617
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      db-network:
        aliases:
          - mariadb-db-W02-09-Docker-MySQL

  adminer:
    image: adminer:latest
    container_name: adminer-web-W02-09-Docker-MySQL
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "5050:8080"
    depends_on:
      - mariadb
    networks:
      - db-network

volumes:
  mariadb_data:

networks:
  db-network:
    driver: bridge
