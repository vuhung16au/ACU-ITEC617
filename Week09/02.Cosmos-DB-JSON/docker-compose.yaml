version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb-W09-02-cosmos-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: itec617
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - db-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-W09-02-cosmos-db
    ports:
      - "5050:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: user
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://user:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb
    networks:
      - db-network

volumes:
  mongodb_data:

networks:
  db-network:
    driver: bridge
